<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSClass</title>
    <style>
        a:link {
            color: blue;
        }

        a:visited {
            color: red;
        }

        a:hover {
            text-decoration: overline;
            color: purple;
        }

        a:active {
            text-decoration: overline;
            color: pink;
        }

        div.d1 {
            border: 1px dashed red;
            width: 400px;
            padding: 15px;
        }

        div.d1:hover {
            background-color: yellow;
        }

        div.d2 {
            border: 1px solid green;
            width: 400px;
            padding: 15px;
        }

        div.d2:hover {
            background-color: green;
        }

        div.d3 {
            color: blue;
            width: 200px;
            height: 100px;
            background-color: green;
            opacity: 0.9;
        }

        div.d3:hover {
            color: red;
            width: 400px;
            height: 50px;
            background-color: yellow;
            opacity: 0.5;
            transition: all 1.5s linear 0.5s;
        }
    </style>
</head>

<body>
    <h2>Pseudo Class</h2>
    <p>
        <a href="http://www.w3.org" target="_blank">W3C 방문</a>
    </p>
    <div class="d1">
        <h3>가상 클래스 1 영역</h3>
        마우스 위치에 따른 박스의 스타일 변화를 보이시오
    </div>
    <p></p>
    <hr>
    <div class="d2">
        <h3>가상 클래스 2 영역</h3>
        마우스 위치에 따른 박스의 스타일 변화를 보이시오
    </div>
    <hr>
    </p>
    <h3>가상 선택자</h3>
    <div class="d3">
        가상 클래스를 이용한 애니메이션 효과 <br>
        마우스가 위에 있으면 박스가 늘어나요
    </div>
    <p></p>
    <hr>
</body>

</html>
