<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css_class</title>
    <style>
        .class1 {
            color: blue;
            background-color: yellow;
        }

        .class2 {
            color: red;
            background-color: green;
        }

        h3.class1 {
            color: navy;
            background-color: pink;
        }

        h2#id1 {
            color: navy;
            background-color: pink;
        }

        h1 {
            color: red;
            background-color: gray;
        }

        p[text] {
            color: yellow;
            background-color: blue;
        }

        h1[text="attr3"] {
            color: green;
            background-color: pink;
        }
    </style>
</head>

<body>
    <h1 class="class1">Class 1 입니다.</h1>
    <p class="class1">Class 1 입니다</p>
    <h1 class="class2">Class 2 입니다.</h1>
    <p1 class="class2">Class 2 입니다.</p1>
    <h3 class="class1">Element+Class Selector</h3>
    <hr>

    <h1 id="id1">ID1 선택자</h1>
    <p id="id1">ID1 선택자</p>
    <h1 id="id2">ID2 선택자</h1>
    <p id="id2">ID2 선택자</p>
    <h2>H2 Default</h2>
    <h2 id="id1">Element+ID Selector</h2>
    <hr>

    <h1 text="attr1">text 속성 이름 선택자</h1>
    <p text>text 속성 이름 선택자</p>
    <h1 text="id2">ID2 선택자</h1>
    <h1 text="attr3">text 속성 이름 선택자</h1>
    <p text="id2">ID2 선택자</p>
    <h2>H2 Default</h2>
    <h2 text="id1">Element+ID Selector</h2>
</body>

</html>
