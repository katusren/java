<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img</title>
</head>

<body>
    <h1>하이퍼 미디어</h1>
    <a href="http://www.w3c.org" target="_blank">
        <img src="./resource/html5.jpg" alt="W3C Log" title="W3C 공식 웹페이지" border="2"
            style="width: 100px; height: 110px;">
    </a>

    <a href="http://soldesk.com" target="_blank">
        <img src="./resource/soldesk_log.png" alt="SOLDESK Log" title="SOLDESK 공식 웹페이지" border="2"
            style="width: 200px; height: 50px;">
    </a>

    <a href="http://en.wikipedia.org/wiki/Isaac_Newton" target="_blank">
        <img src="./resource/newton.gif" alt="newton Log" title="뉴턴 공식 홈페이지로 이동" border="2"
            style="width: 170px; height: 100px" />
    </a>
    <hr />
    <h1>Figure 태그</h1>
    <figure>
        <img src="./resource/html5.jpg" title="W3C 공식 웹페이지">
        <figcaption>[그림1 HTML5]</figcaption>
    </figure>
    <p />
    <figure>
        <figcaption>[그림2 GOOGLE]</figcaption>
        <img src="./resource/google.jpg" title="GOOGLE 공식 웹페이지">
    </figure>
</body>

</html>
