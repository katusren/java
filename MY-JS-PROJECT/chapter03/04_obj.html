<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ById</title>
</head>

<body>
    <p>[Hong's Car]</p>
    <p id="carname"></p>
    <p id="carcolor"></p>
    <p id="carspeed"></p>
    <p>[Kim's Car]</p>
    <p id="carname2"></p>
    <p id="carcolor2"></p>
    <p id="carspeed2"></p>
    <p id="carprice"></p>

    <script>
        function Car(name, color, speed) {
            this.name = name;
            this.color = color;
            this.speed = speed;
            this.speedup = function () {
                return this.speed + 10;
            };
            this.speeddown = function () {
                return this.speed - 10;
            };
        }

        let Hongcar = new Car('Sonata', 'blue', 100);
        let Kimcar = new Car('Jeep', 'red', 120);

        Kimcar.price = '3천만원';
        delete Kimcar.color;

        var cname = document.getElementById("carname");
        cname.textContent = '자동차 이름: ' + Hongcar.name;
        var cspeed = document.getElementById("carspeed");
        cspeed.textContent = '자동차 속도: ' + Hongcar.speedup();
        var ccolor = document.getElementById("carcolor");
        ccolor.textContent = '자동차 색상: ' + Hongcar.color;

        var cname = document.getElementById("carname2");
        cname.textContent = '자동차 이름: ' + Kimcar.name;
        var cspeed = document.getElementById("carspeed2");
        cspeed.textContent = '자동차 속도: ' + Kimcar.speeddown();
        var ccolor = document.getElementById("carcolor2");
        ccolor.textContent = '자동차 색상: ' + Kimcar.color;
        var cprice = document.getElementById("carprice");
        cprice.textContent = '자동차 가격: ' + Kimcar.price;
    </script>

</body>

</html>
