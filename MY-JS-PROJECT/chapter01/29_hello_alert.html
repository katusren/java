<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello_Alert</title>
</head>

<body>
    <input type="button" onclick="alert('Hello_Alert')" value="Hello_Alert">
    <input type="button" id="soldesk" value="Hello_Alert">

    <script>
        let soldesk = document.getElementById('soldesk');
        soldesk.addEventListener('click', function () {
            alert('Hello_Alert');
        })
    </script>
</body>

</html>
