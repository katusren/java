<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var radios = document.querySelectorAll('input[type="radio"]');
            var output = document.getElementById("output");

            radios.forEach(function (radio) {
                radio.addEventListener("change", function () {
                    var selectColor = document.querySelector('input[name="color"]:checked').value;
                    console.log(selectColor);
                    output.textContent = "선택된 색상: " + selectColor;
                });
            });
        });
    </script>
</head>

<body>
    <input type="radio" name="color" value="red" id="radio" />
    <label for="redRadio">빨강</label>
    <input type="radio" name="color" value="green" id="radio" />
    <label for="redRadio">초록</label>
    <input type="radio" name="color" value="blue" id="radio" />
    <label for="redRadio">파랑</label>
    <div id="output"></div>
</body>

</html>
