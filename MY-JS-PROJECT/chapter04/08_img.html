<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            var button = document.getElementById("myButton");
            var Image = document.getElementById("myImage");
            var ImageIndex = 1;

            button.addEventListener("click", function () {
                ImageIndex = ImageIndex === 1 ? 2 : 1;
                Image.src = "img" + ImageIndex + ".jpg";
            });

        });

        function buttonEvent() {
            var button = document.getElementById("myButton1");
            button.addEventListener("click", function () {
                console.log("버튼이 클릭되었습니다.");
            });
        }


    </script>
</head>

<body>
    <button id="myButton">이미지 변경</button>
    <p></p>

    <img id="myImage" src="img1.jpg" alt="이미지" />

    <p id="msg">버튼 이벤트</p>
    <input type="button" id="myButton1" onclick="buttonEvent()" value="텍스트 스타일 변경" />

</body>

</html>
