<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일별 박스 오피스</title>
    <link rel="stylesheet" href="movie.css">
</head>

<body>
    <div class="box1">일별 박스 오피스</div>
    <div class="box2">
        <input type="date" id="dateInput" />
        <button type="button" id="btn1">확인</button> <!-- 확인" 버튼 클릭 이벤트로 동작 시작 -->
        <div id="msg"></div> <!-- 영화 순위 리스트 출력 공간 -->
        <div class="box3"></div>
    </div>

    <script>
        const dateInput = document.querySelector("#dateInput");
        const msg = document.querySelector("#msg");
        const box3 = document.querySelector("#box3");

        // 어제 날짜를 기본값으로 설정하는 코드

        // 상세 정보 보여주기
        function show(movieCd) {
            const url = `https://www.kobis.or.kr/kobisopenapi/webservice/rest/movie/searchMovieInfo.json?key=69a135958d6dbcbd8dd99b5bbc851732&movieCd=${movieCd}`;

            // 박스 오피스 API 호출
            fetch(url).then(res => res.json()).then(data => {
                const info = data.movieInfoResult.movieInfo;
                let str = "<ul>";
                str += `<li> 영화 제목: ${info.movieNm}</li>`;
            })
        }

        // 박스 오피스 조회



    </script>
</body>

</html>
