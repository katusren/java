    <script>
        var com = [95, 88, 72, 68, 99, 85, 78, 95, ,] // 10명 중 8명의 점수만 입력됨

        var getAvg;
        function printAge() {
            var i, sum = 0;
            var count = 0;
            var n = com.length;
            document.write(n + "명의 점수 입력<p/>");
            for (i = 0; i < n; i++) {
                if (com[i] === undefined) {
                    continue;
                } else {
                    sum += com[i];
                    count++;
                }
            }

            document.write("점수가 입력한 학생: " + count + "<p/>");
            document.write("총 점수의 합계: " + sum + "<p/>");
            return (sum / count);
        }

        getAvg = printAge();
        document.write("점수의 평균: " + getAvg + "<p/>");

    </script>
